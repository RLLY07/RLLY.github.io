<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neem contact op met Railey, online bekend als RLLY.">
    <title>Contact — RLLY</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="RLLY, startpagina"><span aria-hidden="true">R</span>LLY</a>
        <nav aria-label="Hoofdnavigatie">
            <a href="index.html">Whoami</a>
            <a href="projects.html">Projecten</a>
            <a href="blog.html">Blog</a>
        </nav>
        <a class="header-note" href="contact.html" aria-current="page">Neem contact op <span
                aria-hidden="true">↗</span></a>
    </header>

    <main id="main-content">
        <section class="contact-section" aria-labelledby="contact-heading">
            <header class="contact-intro">
                <p class="eyebrow">CONTACT</p>
                <h1 id="contact-heading">Stuur me<br><em>een bericht.</em></h1>
                <p class="contact-note">Heb je een vraag of een idee? Laat hieronder iets achter.</p>
            </header>
            <form id="contact-form" class="contact-form" novalidate>
                <div class="form-field">
                    <label for="contact-name">Naam</label>
                    <input id="contact-name" name="name" type="text" autocomplete="name" required data-validate
                        aria-describedby="contact-name-error">
                    <p id="contact-name-error" class="field-error"></p>
                </div>
                <div class="form-field">
                    <label for="contact-email">E-mailadres</label>
                    <input id="contact-email" name="email" type="email" autocomplete="email" required data-validate
                        aria-describedby="contact-email-error">
                    <p id="contact-email-error" class="field-error"></p>
                </div>
                <div class="form-field">
                    <label for="contact-message">Bericht</label>
                    <textarea id="contact-message" name="message" rows="5" required data-validate
                        aria-describedby="contact-message-error"></textarea>
                    <p id="contact-message-error" class="field-error"></p>
                </div>
                <button class="contact-submit" type="submit">Controleer bericht <span
                        aria-hidden="true">↗</span></button>
                <p id="contact-status" class="contact-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer"><span>© 2026 Railey / RLLY</span><span>Gemaakt met aandacht.</span><a
            href="contact.html">Neem contact op</a></footer>
    <script src="script.js" defer></script>
</body>

</html>
